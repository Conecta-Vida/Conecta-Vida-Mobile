# Nginx do container mobile-web (app Flutter compilado para Web)
#  - Serve o build estático do Flutter Web
#  - Encaminha /api/* para o serviço mobile-api do Swarm (DNS interno da rede overlay)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolver DNS interno do Docker: permite que o Nginx suba antes da mobile-api
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $mobile_api http://mobile-api:8081;

    location /api/ {
        proxy_pass $mobile_api;
        proxy_set_header Host $http_host;   # mantém a porta (mesma origem para o CORS)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # O Flutter não põe hash nos nomes: sempre revalidar o app
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
