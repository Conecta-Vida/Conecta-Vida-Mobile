name: Flutter Web build

on:
  push:
    branches: [mobile]
  pull_request:
    branches: [mobile]

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --dart-define=API_BASE_URL=/api
